<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Task Flow - A modern, sleek Task Management application powered by FastAPI with real-time in-memory tracking.">
  <title>Task Flow — Modern Task Management</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-section">
        <div class="brand-logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 11 3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">Task Flow</h1>
          <p class="brand-subtitle">FastAPI In-Memory Task Manager</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="api-status-badge" id="api-status" title="API status">
          <span class="status-dot"></span>
          <span>API Connected</span>
        </div>
        <a href="/docs" target="_blank" rel="noopener noreferrer" class="docs-link" id="link-swagger-docs">
          <span>Docs</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>
      </div>
    </header>

    <main>
      <!-- Stats Dashboard -->
      <section class="stats-banner" aria-label="Task Statistics">
        <div class="stat-item">
          <span class="stat-label">Total Tasks</span>
          <span class="stat-value" id="stat-total">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Pending</span>
          <span class="stat-value" id="stat-pending">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Completed</span>
          <span class="stat-value" id="stat-completed">0</span>
        </div>
        <div class="stat-progress-col">
          <div class="progress-header">
            <span class="stat-label">Completion Rate</span>
            <span class="progress-pct" id="stat-rate">0%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progress-meter">
            <div class="progress-bar" id="stat-progress-bar"></div>
          </div>
        </div>
      </section>

      <!-- Create Task Card -->
      <section class="create-card">
        <h2 class="card-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add New Task
        </h2>
        <form id="create-task-form" class="task-form">
          <div class="input-group">
            <label for="task-title-input" class="form-label">Task Title *</label>
            <input 
              type="text" 
              id="task-title-input" 
              name="title" 
              placeholder="e.g. Design API architecture..." 
              class="form-input" 
              required 
              autocomplete="off"
              maxlength="120"
            />
          </div>
          <div class="input-group">
            <label for="task-desc-input" class="form-label">Description (Optional)</label>
            <textarea 
              id="task-desc-input" 
              name="description" 
              placeholder="Add key details, subtasks, or links..." 
              class="form-textarea"
              rows="2"
            ></textarea>
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary" id="btn-submit-task">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Create Task</span>
            </button>
          </div>
        </form>
      </section>

      <!-- Task Controls (Filter & Search) -->
      <section class="controls-bar" aria-label="Task Filters">
        <div class="filter-tabs" role="tablist">
          <button type="button" class="filter-tab active" data-filter="all" id="filter-all" role="tab" aria-selected="true">
            All Tasks
          </button>
          <button type="button" class="filter-tab" data-filter="pending" id="filter-pending" role="tab" aria-selected="false">
            Active
          </button>
          <button type="button" class="filter-tab" data-filter="completed" id="filter-completed" role="tab" aria-selected="false">
            Completed
          </button>
        </div>

        <div class="search-box">
          <span class="search-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input 
            type="search" 
            id="search-input" 
            placeholder="Search tasks..." 
            aria-label="Search tasks"
            autocomplete="off"
          />
        </div>
      </section>

      <!-- Tasks List Container -->
      <section id="tasks-container" class="task-list" aria-live="polite">
        <!-- Dynamically populated tasks will appear here -->
      </section>
    </main>
  </div>

  <!-- Edit Task Modal Dialog -->
  <dialog id="edit-dialog" aria-labelledby="edit-dialog-title">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="edit-dialog-title" class="modal-title">Edit Task</h3>
        <button type="button" class="icon-btn" id="btn-close-edit-modal" aria-label="Close dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form id="edit-task-form" class="task-form">
        <input type="hidden" id="edit-task-id" />
        <div class="input-group">
          <label for="edit-task-title" class="form-label">Task Title *</label>
          <input type="text" id="edit-task-title" class="form-input" required maxlength="120" />
        </div>
        <div class="input-group">
          <label for="edit-task-desc" class="form-label">Description</label>
          <textarea id="edit-task-desc" class="form-textarea" rows="3"></textarea>
        </div>
        <div class="form-footer" style="gap: 0.75rem;">
          <button type="button" class="btn btn-ghost" id="btn-cancel-edit">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-edit">Save Changes</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Toast Notification Stack -->
  <div class="toast-container" id="toast-container" aria-live="assertive"></div>

  <!-- Frontend Logic -->
  <script src="/static/app.js"></script>
</body>
</html>
